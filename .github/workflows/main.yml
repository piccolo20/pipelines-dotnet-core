name: ASP.NET Core Unified Build

on:
  push:
    branches:
      - master

env:
  buildConfiguration: 'Release'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # The underlying script command that both Azure and GitHub run identically
    - name: Dotnet Build Execution
      run: dotnet build --configuration ${{ env.buildConfiguration }}